<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Meet Light</title>
    <link rel="stylesheet" href="led-indicator.css" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2937;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .status-card {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        background: #f9fafb;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 13px;
      }

      .status-row:last-child {
        margin-bottom: 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
      }

      .dot.green {
        background: #22c55e;
      }

      .dot.blue {
        background: #2563eb;
      }

      .dot.red {
        background: #ef4444;
      }

      .dot.disconnected {
        background: #9ca3af;
      }

      .dot.connecting {
        background: #eab308;
      }

      .diagnostics {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #e5e7eb;
        font-size: 12px;
        color: #6b7280;
      }

      .diagnostics-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }

      .diagnostics-row span:last-child {
        color: #374151;
        font-weight: 500;
        max-width: 140px;
        text-align: right;
        word-break: break-word;
      }

      .btn-secondary {
        background: #4b5563;
      }

      .main-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .btn-link,
      .btn-link:hover {
        width: auto;
        margin-top: 8px;
        padding: 0;
        background: none;
        color: #2563eb;
        font-size: 12px;
        text-decoration: underline;
      }

      .btn-secondary:hover {
        background: #374151;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        background: #93c5fd;
        cursor: wait;
      }

      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.4;
      }

      .error {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 12px;
        line-height: 1.4;
        display: none;
      }

      .error.visible {
        display: block;
      }

      .section-label {
        margin: 14px 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
      }

      .color-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }

      .color-buttons button {
        width: auto;
        padding: 8px 6px;
        font-size: 12px;
      }

      .btn-green {
        background: #16a34a;
      }

      .btn-green:hover {
        background: #15803d;
      }

      .btn-blue {
        background: #2563eb;
      }

      .btn-blue:hover {
        background: #1d4ed8;
      }

      .btn-red {
        background: #dc2626;
      }

      .btn-red:hover {
        background: #b91c1c;
      }

      .btn-restore {
        background: #4b5563;
        margin-bottom: 0;
      }

      .btn-restore:hover {
        background: #374151;
      }

      .color-buttons button:disabled,
      .btn-restore:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Meet Light</h1>

    <div class="led-preview" aria-live="polite">
      <div id="led-lamp" class="led-lamp led-blink-blue" aria-label="Sin conexión serial"></div>
      <p id="led-label" class="led-label">Sin conexión serial (parpadeo azul)</p>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span>Estado</span>
        <span id="meeting-status">Libre</span>
      </div>
      <div class="status-row">
        <span>Arduino</span>
        <span id="serial-status">
          <span class="dot disconnected"></span>Desconectado
        </span>
      </div>
      <div class="diagnostics">
        <div class="diagnostics-row">
          <span>Puertos detectados</span>
          <span id="ports-found">—</span>
        </div>
        <div class="diagnostics-row">
          <span>Último error</span>
          <span id="last-error">—</span>
        </div>
      </div>
    </div>

    <p class="section-label">Reportes en la nube</p>
    <div class="status-card">
      <div class="status-row">
        <span>Cuenta</span>
        <span id="cloud-account">Sin vincular</span>
      </div>
      <div class="status-row">
        <span>Pendientes de subir</span>
        <span id="cloud-pending">0</span>
      </div>
      <button id="cloud-unlink-btn" class="btn-link" type="button" hidden>Desvincular cuenta</button>
    </div>

    <div class="main-buttons">
      <button id="connect-btn" type="button">Conectar Arduino</button>
      <button id="history-btn" class="btn-secondary" type="button">Historial de juntas</button>
      <button id="cloud-main-btn" class="btn-secondary" type="button">Vincular cuenta de Google</button>
    </div>
    <p id="error-msg" class="error" role="alert"></p>

    <p class="section-label">Prueba manual del LED</p>
    <div class="color-buttons">
      <button id="btn-green" class="btn-green" type="button" disabled>Verde</button>
      <button id="btn-blue" class="btn-blue" type="button" disabled>Azul</button>
      <button id="btn-red" class="btn-red" type="button" disabled>Rojo</button>
    </div>
    <button id="btn-restore" class="btn-restore" type="button" disabled>Restaurar estado</button>

    <p class="hint">
      El círculo de arriba replica el LED del Arduino. Si se desconecta, pulsa
      Reconectar Arduino.
    </p>

    <script src="led-indicator.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Historial de juntas - Meet Light</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }

      .summary {
        margin: 0 0 16px;
        font-size: 14px;
        color: #6b7280;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      button {
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-danger {
        background: #dc2626;
      }

      .btn-danger:hover {
        background: #b91c1c;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
        font-size: 13px;
      }

      th,
      td {
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid #e5e7eb;
      }

      th {
        background: #f3f4f6;
        font-weight: 600;
        white-space: nowrap;
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.nowrap {
        white-space: nowrap;
      }

      .live {
        color: #dc2626;
        font-weight: 600;
      }

      .muted {
        color: #9ca3af;
      }

      .empty {
        padding: 32px;
        text-align: center;
        color: #6b7280;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Historial de juntas</h1>
      <p id="summary" class="summary"></p>

      <div class="toolbar">
        <button id="export-btn" type="button">Exportar CSV</button>
        <button id="clear-btn" class="btn-danger" type="button">Borrar historial</button>
      </div>

      <div id="empty" class="empty" hidden>Todavía no hay juntas registradas.</div>
      <table id="table" hidden>
        <thead>
          <tr>
            <th>Inicio</th>
            <th>Duración</th>
            <th>Plataforma</th>
            <th>Junta</th>
            <th>Integrantes</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>

    <script type="module" src="history.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Conectar Arduino - Meet Light</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2937;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #6b7280;
        line-height: 1.5;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        background: #93c5fd;
        cursor: wait;
      }

      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.4;
        display: none;
      }

      .status.visible {
        display: block;
      }

      .status.error {
        background: #fef2f2;
        color: #b91c1c;
      }

      .status.success {
        background: #f0fdf4;
        color: #15803d;
      }

      .status.info {
        background: #eff6ff;
        color: #1d4ed8;
      }

      ol {
        margin: 0 0 16px;
        padding-left: 20px;
        font-size: 13px;
        color: #4b5563;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>Conectar Arduino</h1>
    <p>Esta ventana debe permanecer abierta mientras eliges el puerto USB.</p>

    <ol>
      <li>Cierra Arduino IDE y Monitor Serial</li>
      <li>Pulsa el botón de abajo</li>
      <li>Elige el puerto del Arduino (Mac: <strong>usbmodem</strong> o <strong>usbserial</strong>)</li>
    </ol>

    <button id="connect-btn" type="button">Elegir puerto USB</button>
    <div id="status-msg" class="status" role="alert"></div>

    <script src="connect.js"></script>
  </body>
</html>
